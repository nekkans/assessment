name: CI Pipeline

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

  steps: 
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '15'

    - name: Install dependencies
      run: npm install
      working-directory: rdicidr-0.1.0

    - name: Run linter
      run: npm run lint
      working-directory: rdicidr-0.1.0

    - name: Run formatter
      run: npm run prettier
      working-directory: rdicidr-0.1.0

    - name: Run tests
      env: 
        CI: true
      run: npm run test
      working-directory: rdicidr-0.1.0

    - name: Build project
      run: npm run build
      working-directory: rdicidr-0.1.0